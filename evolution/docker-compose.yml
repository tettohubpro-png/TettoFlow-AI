# Evolution API v2 — stack local para TettoFlow
# Pré-requisito: Docker Desktop instalado e rodando
# Docs: https://docs.evolutionfoundation.com.br/evolution-api/install/docker

services:
  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    networks:
      - evolution_net

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution_net

  evolution-api:
    # Projeto migrou de org no Docker Hub: atendai/evolution-api (v2.2.3 e anteriores)
    # não existe mais publicamente — usar evoapicloud/evolution-api a partir daqui.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: tettoflow-evolution-key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_secret@evolution-postgres:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,WEBHOOKS
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

volumes:
  evolution_pg_data:
  evolution_redis_data:
  evolution_instances:

networks:
  evolution_net:
    driver: bridge
